name: agate Metal userspace diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal-userspace:
    runs-on: macos-15
    timeout-minutes: 65
    env:
      JOBS: 4
      VIVA_CCACHE: ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned Viva sources
        run: |
          git init viva
          git -C viva fetch --depth 1 https://github.com/Nik300/viva-gpu.git 9ebe5e46f74f6d75fce1d76b2ea4ea603cb63637
          git -C viva checkout --detach FETCH_HEAD
          test "$(git -C viva rev-parse HEAD)" = 9ebe5e46f74f6d75fce1d76b2ea4ea603cb63637
          cp agate/patches-viva/0007-*.patch viva/mesa/patches/
          git -C viva apply --check ../agate/patches-viva/0008-viva-report-kernel-gpu-id.patch
          git -C viva apply ../agate/patches-viva/0008-viva-report-kernel-gpu-id.patch
      - name: Build tools
        run: |
          brew install llvm spirv-llvm-translator spirv-tools zstd pkgconf ccache
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build iOS Metal bundle and tests
        run: |
          cd viva
          bash ios/build.sh all
      - name: Verify and package
        run: |
          set -euo pipefail
          cd viva/ios/out
          test -x VivaMTLDriver.bundle/VivaMTLDriver
          test -x tests/phase3
          test -x tests/vmprobe
          test -x tests/test_vgpu
          codesign --verify --strict VivaMTLDriver.bundle
          for binary in VivaMTLDriver.bundle/VivaMTLDriver tests/vmprobe tests/phase3 tests/test_vgpu; do
            test "$(lipo -archs "$binary")" = arm64
          done
          strings VivaMTLDriver.bundle/VivaMTLDriver | awk '/^Mali-G77$/ { found=1 } END { exit !found }'
          cp ../../LICENSE ../../NOTICE .
          tar -czf "$GITHUB_WORKSPACE/agate-metal-ios.tar.gz" VivaMTLDriver.bundle tests LICENSE NOTICE
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 agate-metal-ios.tar.gz > agate-metal-ios.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agate-metal-ios
          path: |
            agate-metal-ios.tar.gz
            agate-metal-ios.sha256
          if-no-files-found: error
