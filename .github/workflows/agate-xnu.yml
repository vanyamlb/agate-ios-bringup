name: agate Metal pilot programs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paint-pilot:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and sign the iOS pilot
        run: |
          set -eu
          mkdir -p pilot uapi
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Nik300/viva-gpu/9ebe5e46f74f6d75fce1d76b2ea4ea603cb63637/uapi/viva_gpu_uapi.h -o uapi/viva_gpu_uapi.h
          printf '%s\n' 'b63438d24ff6c18000ef148b585d404f8e800f857c5f12ea746d5c208d5318d1  uapi/viva_gpu_uapi.h' | shasum -a 256 -c -
          if test -d /Applications/Xcode_16.4.app/Contents/Developer; then
            export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk iphoneos metal -target air64-apple-ios16.0 -std=ios-metal2.4 -c \
            agate/tools/metal-pilot/triangle.metal -o triangle.air
          xcrun --sdk iphoneos metal -target air64-apple-ios16.0 triangle.air -o pilot/triangle.metallib
          test "$(head -c 4 pilot/triangle.metallib)" = MTLB
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          "$CC" -isysroot "$SDK" -target arm64-apple-ios16.0 -Oz -Wall -Wextra -Werror \
            agate/tools/metal-pilot/init.c -o pilot/metal-init
          "$CC" -isysroot "$SDK" -target arm64-apple-ios16.0 -Oz -Wall -Wextra -Werror -fobjc-arc -Iuapi \
            agate/tools/metal-pilot/smoke.m -framework Foundation -framework Metal -framework IOKit -o pilot/metal-smoke
          cd pilot
          for f in metal-init metal-smoke; do
            codesign -s - --force "$f"
            codesign --verify --strict "$f"
            test "$(lipo -archs "$f")" = arm64
          done
          shasum -a 256 metal-init metal-smoke triangle.metallib > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agate-metal-pilot
          path: pilot/
          if-no-files-found: error
